openapi: 3.0.3
info:
  title: Places API
  version: 1.0.0
  description: API for user authentication and place management.
servers:
  - url: http://localhost:5001/api/v1
    description: Local development server
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Users returned successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createUser
      summary: Sign up a user
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /places:
    get:
      operationId: listPlaces
      summary: List places
      parameters:
        - name: creatorId
          in: query
          required: false
          schema:
            type: string
          description: Return only places created by this user.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Places returned successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createPlace
      summary: Create a place
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePlaceRequest'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Place created successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place:
                    $ref: '#/components/schemas/Place'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/sessions:
    post:
      operationId: loginUser
      summary: Authenticate a user
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /places/{placeId}:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      operationId: getPlace
      summary: Get a place
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Place returned successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place:
                    $ref: '#/components/schemas/Place'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updatePlace
      summary: Update a place
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaceRequest'
      responses:
        '200':
          description: Place updated successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [place]
                properties:
                  place:
                    $ref: '#/components/schemas/Place'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deletePlace
      summary: Delete a place
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Place deleted successfully.
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
    PlaceId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  headers:
    CorrelationId:
      description: Identifier used to correlate the request with server logs.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request contains an invalid or unsupported upload.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected server error occurred.
      headers:
        x-correlation-id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    User:
      type: object
      required: [id, name, email, image, places]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        image:
          type: string
          description: URL path to the profile image.
        places:
          type: array
          items:
            type: string
          description: IDs of places created by the user.
    CreateUserRequest:
      type: object
      required: [name, email, password, image]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          writeOnly: true
        image:
          type: string
          format: binary
          description: JPEG or PNG profile image, up to 500 KB.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
    Place:
      type: object
      required: [id, title, description, image, address, location, creator]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
          description: URL path to the place image.
        address:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        creator:
          type: string
    CreatePlaceRequest:
      type: object
      required: [title, description, address, image]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 5
        address:
          type: string
          minLength: 1
        image:
          type: string
          format: binary
          description: JPEG or PNG place image, up to 500 KB.
    AuthResponse:
      type: object
      required: [userId, email, token]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        token:
          type: string
          description: JWT bearer token, valid for one hour.
    UpdatePlaceRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 5
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
